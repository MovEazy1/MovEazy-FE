<!doctype html>
<html lang="en">
  <head>
    <!-- Prefer apex host for SEO (Firebase Hosting has no hostname-based 301 in firebase.json). -->
    <script>
      (function () {
        if (location.hostname === "www.moveazy.co.in") {
          location.replace(
            location.protocol + "//moveazy.co.in" + location.pathname + location.search + location.hash
          );
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>MovEazy — Move to a New City Without the Chaos</title>
    <meta name="description" content="MovEazy connects you with trusted brokers, personalized city guidance, and deposit protection. Find your next home in Bengaluru with ease." />
    <meta name="keywords" content="rental, housing, Bengaluru, broker, apartments, PG, deposit protection, MovEazy" />
    <meta name="author" content="MovEazy" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MovEazy — Move to a New City Without the Chaos" />
    <meta property="og:description" content="Find trusted brokers, real-time listings, and deposit protection for your next move." />
    <meta property="og:image" content="/logo-moveazy-bar.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MovEazy — Move to a New City Without the Chaos" />
    <meta name="twitter:description" content="Find trusted brokers, real-time listings, and deposit protection for your next move." />

    <!-- Theme -->
    <meta name="theme-color" content="#E85A4F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
