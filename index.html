<!doctype html>
<html lang="en">
  <head>
    <!-- Canonical host (www.moveazy.co.in) is enforced by Vercel's apex→www 308 redirect,
         so no client-side hostname redirect is needed here. -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>MovEazy — Move to a New City Without the Chaos</title>
    <meta name="description" content="MovEazy connects you with trusted brokers, personalized city guidance, and deposit protection. Find your next home in Bengaluru with ease." />
    <meta name="keywords" content="rental, housing, Bengaluru, broker, apartments, PG, deposit protection, MovEazy" />
    <meta name="author" content="MovEazy" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MovEazy — Move to a New City Without the Chaos" />
    <meta property="og:description" content="Find trusted brokers, real-time listings, and deposit protection for your next move." />
    <!-- Absolute, because Facebook and WhatsApp resolve og:image against their
         own crawler rather than the page, and a relative path is a coin flip.
         1200x630 is the size both crop to. Listing links do NOT use this: /p/:id
         serves its own tags with a collage of the flat's photos. -->
    <meta property="og:image" content="https://www.moveazy.co.in/og-share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="800" />
    <meta property="og:image:alt" content="MovEazy — your weekend shouldn't be spent hunting for a flat." />
    <meta property="og:url" content="https://www.moveazy.co.in/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MovEazy — Move to a New City Without the Chaos" />
    <meta name="twitter:description" content="Find trusted brokers, real-time listings, and deposit protection for your next move." />
    <!-- summary_large_image without an image renders as a bare text card. -->
    <meta name="twitter:image" content="https://www.moveazy.co.in/og-share.jpg" />

    <!-- Theme -->
    <meta name="theme-color" content="#E85A4F" />
    <!-- partners.moveazy.co.in installs as its own app, "MovEazy Partners"
         (same deployment as every other host, so only there). Chrome's install
         offer is kept for the app's own banner (src/lib/pwaInstall.js); it can
         arrive before React has loaded. -->
    <script>
      (function () {
        if (!/^partners\./i.test(location.hostname)) return;
        var h = document.head;
        function add(tag, attrs) { var el = document.createElement(tag); for (var k in attrs) el.setAttribute(k, attrs[k]); h.appendChild(el); }
        add("link", { rel: "manifest", href: "/partners.webmanifest" });
        add("link", { rel: "apple-touch-icon", href: "/partners-apple-touch-icon.png" });
        add("meta", { name: "apple-mobile-web-app-title", content: "MovEazy Partners" });
        add("meta", { name: "apple-mobile-web-app-capable", content: "yes" });
        add("meta", { name: "mobile-web-app-capable", content: "yes" });
        add("meta", { name: "apple-mobile-web-app-status-bar-style", content: "black" });
        var theme = document.querySelector('meta[name="theme-color"]');
        if (theme) theme.setAttribute("content", "#0E0D12");
        window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__pzInstall = e; window.dispatchEvent(new Event("pz-install-ready")); });
        window.addEventListener("appinstalled", function () { window.__pzInstall = null; window.__pzInstalled = true; window.dispatchEvent(new Event("pz-install-ready")); });
      })();
      // The CRM installs as "MovEazy CRM" from moveazy.co.in/crm (scope /crm/),
      // its offer kept for CRM Home's install card (pages/crm/mobile/crmInstall.js).
      (function () {
        if (/^partners\./i.test(location.hostname) || !/^\/crm(\/|$)/.test(location.pathname)) return;
        var h = document.head;
        function add(tag, attrs) { var el = document.createElement(tag); for (var k in attrs) el.setAttribute(k, attrs[k]); h.appendChild(el); }
        add("link", { rel: "manifest", href: "/crm.webmanifest" });
        add("link", { rel: "apple-touch-icon", href: "/crm-apple-touch-icon.png" });
        add("meta", { name: "apple-mobile-web-app-title", content: "MovEazy CRM" });
        add("meta", { name: "apple-mobile-web-app-capable", content: "yes" });
        add("meta", { name: "mobile-web-app-capable", content: "yes" });
        add("meta", { name: "apple-mobile-web-app-status-bar-style", content: "default" });
        var theme = document.querySelector('meta[name="theme-color"]');
        if (theme) theme.setAttribute("content", "#FFFFFF");
        window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__crmInstall = e; window.dispatchEvent(new Event("crm-install-ready")); });
        window.addEventListener("appinstalled", function () { window.__crmInstall = null; window.__crmInstalled = true; window.dispatchEvent(new Event("crm-install-ready")); });
      })();
    </script>
    <!-- Every page talks to the database within its first second: open that
         connection now, alongside the page's own files. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- Fonts come with the app's CSS from our own domain (src/styles/fonts.css):
         no request to Google before the page can draw, and each page
         downloads only the faces its text uses. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
